<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زيكو جمال | مدرس التاريخ</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#f7ecd0;color:#2b1d08}
header{background:#1a120b;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
header b{font-size:24px;color:#e8b44a;font-family:'Amiri',serif}
header b span{color:#fff}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:none;border:2px solid #e8b44a;color:#fff;padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:800}
nav button.active{background:#e8b44a;color:#000}
.page{display:none;padding:30px 5%;max-width:1000px;margin:auto}
.page.active{display:block;animation:fade .4s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero{background:linear-gradient(135deg,#c9a227,#8a6d14);border:4px double #1a120b;border-radius:25px;padding:40px 20px;text-align:center;color:#fff}
.hero h1{font-family:'Amiri',serif;font-size:38px;line-height:1.5}
.hero p{margin:15px 0 20px}
.btn{background:#1a120b;color:#e8b44a;padding:13px 28px;border-radius:30px;border:none;font-weight:900;cursor:pointer;font-size:16px}
h2{font-family:'Amiri',serif;font-size:30px;text-align:center;color:#8a6d14;margin:10px 0 20px}
.card{background:#fff;border:2px solid #c9a227;border-radius:18px;padding:20px;margin-bottom:15px}
.card h3{font-size:20px}
.card p{color:#666;margin:8px 0}
.card button{background:#1a120b;color:#e8b44a;border:none;padding:10px 18px;border-radius:20px;font-weight:800;cursor:pointer}
.lesson-detail{background:#fff;border:3px double #c9a227;border-radius:20px;padding:25px;margin-top:15px;display:none}
.lesson-detail.active
